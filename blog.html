<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Pothys Muruganandham</title>
    <meta name="description" content="Read insights on hardware engineering, networking, and tech from Pothys.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Custom Blog CSS -->
    <link rel="stylesheet" href="assets/css/blog.css">
</head>
<body data-bs-theme="light" class="blog-body">
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top blog-nav" id="navbar">
        <div class="container-lg">
            <a class="navbar-brand blog-brand" href="index.html">POTHYS<span>.</span></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#skills">Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#projects">Projects</a></li>
                    <li class="nav-item"><a class="nav-link active" href="blog.html">Blog</a></li>
                    <li class="nav-item">
                        <button class="btn theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
                            <i data-lucide="sun" style="width: 18px; height: 18px;"></i>
                        </button>
                    </li>
                    <li class="nav-item">
                        <a class="btn cta-btn" href="index.html#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="blog-main">
        <div class="container-lg">
            <!-- Posts View: Listing -->
            <div id="postsListing">
                <section class="listing-head mb-3">
                    <div>
                        <h2 class="section-title">Latest Posts</h2>
                    </div>
                    <p class="results-summary" id="resultsSummary">Showing recent published posts</p>
                </section>

                <div class="filter-shell mb-4">
                    <div class="filter-cloud" id="categoryFilters">
                        <button class="filter-pill active" data-category="all">All Posts</button>
                    </div>
                </div>

                <div class="row g-4" id="postsGrid">
                    <!-- Posts rendered here via JS -->
                </div>
            </div>

            <!-- Posts View: Single Post -->
            <div id="singlePostView" style="display: none;">
                <article class="post-article">
                    <button class="btn btn-link btn-sm back-link" id="backButton">
                        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
                        Back to Blog
                    </button>

                    <div class="mb-3">
                        <span class="badge" id="singleCategoryBadge">Technology</span>
                    </div>

                    <h1 id="singlePostTitle" class="single-title"></h1>

                    <div class="d-flex align-items-center gap-3 mb-4 pb-4 border-bottom single-meta">
                        <div class="post-author-avatar" id="singleAuthorAvatar">A</div>
                        <div>
                            <div class="fw-semibold" id="singleAuthorName">Admin</div>
                            <div class="text-muted small" id="singlePostDate">April 15, 2026</div>
                        </div>
                    </div>

                    <img id="singlePostCover" src="" alt="Post cover" class="img-fluid rounded-4 mb-4" style="display: none;">

                    <div class="post-content mb-4" id="singlePostContent">
                        <!-- Content rendered here -->
                    </div>

                    <div class="post-tags mb-4" id="singlePostTags" style="display: none;">
                        <!-- Tags rendered here -->
                    </div>

                    <div class="share-bar border-top pt-4 mt-4">
                        <p class="text-muted mb-3">Share this post</p>
                        <div class="d-flex gap-2 flex-wrap">
                            <button class="btn btn-outline-secondary btn-sm" id="copyLinkBtn">
                                <i data-lucide="link" style="width: 16px; height: 16px; margin-right: 0.35rem;"></i>
                                Copy Link
                            </button>
                            <a href="#" class="btn btn-outline-secondary btn-sm" id="twitterShareBtn" target="_blank" rel="noopener noreferrer">
                                <i data-lucide="twitter" style="width: 16px; height: 16px; margin-right: 0.35rem;"></i>
                                Twitter/X
                            </a>
                        </div>
                    </div>
                </article>
            </div>

            <!-- No Posts Message -->
            <div id="noPostsMessage" class="no-results" style="display: none;">
                <i data-lucide="inbox"></i>
                <p>No posts found. Check back soon!</p>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lucide Icons Initialization -->
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>

    <!-- Blog JS -->
    <script src="assets/js/blog.js?v=20260415"></script>
</body>
</html>
